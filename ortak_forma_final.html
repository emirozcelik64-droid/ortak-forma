<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortak Forma</title>
<style>
body{margin:0;min-height:100vh;background:#07111f;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.box{width:100%;max-width:420px;background:#111827;border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{margin:0 0 6px;font-size:30px}.desc{color:#94a3b8;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#1f2937;border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#94a3b8}
.teams{background:#1f2937;border-radius:22px;padding:24px 12px;text-align:center;margin-bottom:14px}
.team{font-size:28px;font-weight:900;margin:12px 0}.plus{color:#facc15;font-weight:900;font-size:24px}
input{width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;margin-bottom:10px;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:16px;padding:16px 10px;font-size:17px;font-weight:900;color:white}
.green{background:#22c55e}.blue{background:#3b82f6}.red{background:#ef4444;width:100%;margin-top:10px;display:none}
.msg{margin-top:14px;min-height:48px;background:#1f2937;border-radius:16px;padding:14px;text-align:center;font-weight:800;color:#cbd5e1}
.note{font-size:12px;color:#94a3b8;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="box">
<h1>⚽ Ortak Forma</h1>
<p class="desc">İki takımda da oynayan futbolcuyu bul.</p>

<div class="stats">
  <div class="stat"><b id="score">0</b><span>Puan</span></div>
  <div class="stat"><b id="time">30</b><span>Süre</span></div>
  <div class="stat"><b id="life">3</b><span>Can</span></div>
</div>

<div class="teams">
  <div class="team" id="teamA">Galatasaray</div>
  <div class="plus">+</div>
  <div class="team" id="teamB">Barcelona</div>
</div>

<input id="answer" placeholder="Futbolcu adını yaz">
<div class="row">
  <button class="green" onclick="checkAnswer()">Cevapla</button>
  <button class="blue" onclick="passQuestion()">Pas</button>
</div>
<button class="red" id="restart" onclick="restartGame()">Yeniden Başla</button>
<div class="msg" id="msg">Örnek: Arda Turan yazıp Cevapla’ya bas.</div>
<div class="note">Netlify’ye yükleyince iPhone Safari’de daha sağlıklı çalışır.</div>
</div>

<script>
var questions=[
["Galatasaray","Barcelona",["arda turan","hagi","gheorghe hagi"]],
["Barcelona","PSG",["neymar","messi","lionel messi","ronaldinho","zlatan ibrahimovic"]],
["Real Madrid","Chelsea",["eden hazard","courtois","thibaut courtois","mateo kovacic","antonio rudiger"]],
["Liverpool","Bayern Münih",["sadio mane","thiago alcantara","xabi alonso"]],
["Galatasaray","Inter",["wesley sneijder","felipe melo","mauro icardi","hakan sukur"]],
["Fenerbahçe","Real Madrid",["roberto carlos","mesut ozil","arda guler"]],
["Beşiktaş","Barcelona",["miralem pjanic","ricardo quaresma","quaresma"]],
["Manchester United","Real Madrid",["cristiano ronaldo","ronaldo","casemiro","raphael varane","david beckham"]],
["Milan","Barcelona",["ronaldinho","zlatan ibrahimovic","rivaldo","patrick kluivert"]],
["Arsenal","Barcelona",["thierry henry","cesc fabregas","alex song","aubameyang"]],
["Juventus","Real Madrid",["cristiano ronaldo","zinedine zidane","alvaro morata","fabio cannavaro"]],
["Fenerbahçe","Manchester United",["robin van persie","van persie","nani","fred"]],
["Galatasaray","Manchester City",["ilkay gundogan","elano","jason denayer"]],
["Beşiktaş","Chelsea",["demba ba","michy batshuayi","batshuayi"]],
["Trabzonspor","Chelsea",["florent malouda","daniel sturridge"]],
["PSG","Real Madrid",["sergio ramos","angel di maria","keylor navas","achraf hakimi"]],
["Ajax","Barcelona",["johan cruyff","frenkie de jong","luis suarez","patrick kluivert"]],
["Dortmund","Bayern Münih",["robert lewandowski","lewandowski","mario gotze","mats hummels"]],
["Tottenham","Real Madrid",["gareth bale","luka modric","rafael van der vaart"]],
["Inter","Milan",["zlatan ibrahimovic","ronaldo","andrea pirlo","clarence seedorf","hakan calhanoglu"]]
];

var current=questions[0],score=0,life=3,time=30,timer=null;

function $(id){return document.getElementById(id)}
function norm(s){return String(s||"").toLowerCase().trim()
.replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c")
.replace(/â/g,"a").replace(/î/g,"i").replace(/û/g,"u").replace(/\s+/g," ")}
function draw(){ $("score").innerHTML=score; $("life").innerHTML=life; $("time").innerHTML=time; }
function msg(t){ $("msg").innerHTML=t; }
function newQuestion(){
 var q=questions[Math.floor(Math.random()*questions.length)];
 current=q;
 $("teamA").innerHTML=q[0];
 $("teamB").innerHTML=q[1];
 $("answer").value="";
 msg("Cevabını yaz.");
}
function checkAnswer(){
 var user=norm($("answer").value);
 if(!user){msg("Önce futbolcu adı yaz.");return}
 var ok=false;
 for(var i=0;i<current[2].length;i++){ if(norm(current[2][i])===user){ok=true} }
 if(ok){score++;time=Math.min(30,time+3);draw();msg("✅ Doğru!");setTimeout(newQuestion,600)}
 else{wrong("❌ Yanlış!")}
}
function passQuestion(){wrong("Pas geçtin.")}
function wrong(t){
 life--; draw();
 if(life<=0){clearInterval(timer);msg("Oyun bitti. Son puan: "+score+". Cevap: "+current[2][0]);$("restart").style.display="block";return}
 msg(t+" Cevap: "+current[2][0]);
 setTimeout(newQuestion,800);
}
function restartGame(){score=0;life=3;time=30;$("restart").style.display="none";draw();newQuestion();startTimer()}
function startTimer(){
 clearInterval(timer);
 timer=setInterval(function(){time--;draw();if(time<=0){time=30;wrong("Süre bitti.")}},1000)
}
draw();
newQuestion();
startTimer();
</script>
</body>
</html>
